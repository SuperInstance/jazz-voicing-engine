[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jazz-voicing-engine"
version = "0.1.0"
description = "Jazz piano voicing generator with voice leading, comping patterns, and walking bass lines"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.optional-dependencies]
midi = ["mido>=1.3"]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
